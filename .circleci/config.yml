version: 2.1

executors:
  python_base:
    parameters:
      version:
        type: string
        default: "3.9.25"
    docker:
      - image: cimg/python:<< parameters.version >>

orbs:
  coveralls: coveralls/coveralls@2.2.5

commands:
  install_deps:
    description: Install dependencies

    parameters:
      include_syntax:
        type: boolean
        default: false

    steps:
      - restore_cache:
          keys:
            - v2-sshtunnel-{{ arch }}-{{ checksum "setup.py" }}-{{ checksum "tests/requirements.txt" }}-{{ checksum "tests/requirements-syntax.txt" }}
            - v2-sshtunnel-{{ arch }}-
      - run:
          name: Install sshtunnel
          command:  >-
            pipenv
            --python $(which python)
            install
            --skip-lock
            -e
            .
      - run:
          name: Install dev dependencies
          command:  >-
            pipenv
            --python $(which python)
            install
            --skip-lock
            --dev
            -r tests/requirements.txt
      - when:
          condition: << parameters.include_syntax >>
          steps:
            - run:
                name: Install syntax dependencies
                command:  >-
                  pipenv
                  --python $(which python)
                  install
                  --skip-lock
                  --dev
                  -r tests/requirements-syntax.txt
      - save_cache:
          key: v2-sshtunnel-{{ arch }}-{{ checksum "setup.py" }}-{{ checksum "tests/requirements.txt" }}-{{ checksum "tests/requirements-syntax.txt" }}
          paths:
            - .venv/

jobs:
  tests:
    description: Run test suite for each python version and calculate coverage

    parameters:
      version: { type: string }

    executor: { name: python_base, version: << parameters.version >> }

    steps:
      - checkout
      - install_deps
      - run:
          name: Run test suite
          environment:
            COVERAGE_FILE: .coverage.<< parameters.version >>
          command: >-
            pipenv run pytest tests
            --showlocals
            --durations=10
            -n auto
            -W ignore::DeprecationWarning
            --cov sshtunnel
            --cov-report=html:test_results/coverage.html
            --cov-report=term
            --junit-xml=test_results/report.xml
      - persist_to_workspace:
          root: .
          paths:
            - .coverage.*
      - coveralls/upload:
          parallel: true
      - store_test_results:
          path: test_results

  coverage:
    description: Finalize coverage via coveralls

    executor: { name: python_base }

    steps:
      - attach_workspace: { at: . }
      - coveralls/upload:
          parallel_finished: true

  package:
    description: Build artifacts

    executor: { name: python_base }

    steps:
      - checkout
      - install_deps
      - run:
          name: Build artifact
          command: pipenv run python setup.py bdist_wheel sdist
      - run:
          name: Check artifacts
          command: pipenv run twine check dist/*
      - persist_to_workspace:
          root: .
          paths: [dist/*]

  deploy_pypi:
    description: Upload artifacts to PyPI

    parameters:
      repository: { type: string, default: "testpypi" }
      token_env: { type: env_var_name, default: TESTPYPI_TOKEN }

    executor: { name: python_base }

    steps:
      - checkout
      - install_deps
      - attach_workspace: { at: . }
      - run:
          name: Upload to TestPyPI
          command: >-
            pipenv run twine upload
            --repository << parameters.repository >>
            --username __token__
            --password ${<< parameters.token_env >>}
            --skip-existing
            dist/*

  docs:
    description: Produce documentation from source

    executor: { name: python_base }

    steps:
      - checkout
      - install_deps
      - run:
          name: Build documentation
          command: |
            pipenv install --dev -r docs/requirements.txt
            pipenv run sphinx-build -WavE -b html docs _build/html
      - store_artifacts:
          path: _build/html
          destination: sshtunnel-docs

  syntax:
    description: Run syntax validation tests

    executor: { name: python_base }

    steps:
      - checkout
      - install_deps: { include_syntax: true }
      - run:
          name: checking MANIFEST.in
          command: pipenv run check-manifest --ignore tox.ini,tests*,*.yml
      - run:
          name: checking RST syntax
          command: |
            pipenv run python setup.py sdist
            pipenv run twine check dist/*
      - run:
          name: checking PEP8 compliancy
          command: pipenv run flake8 --exclude .venv,build,docs,e2e_tests --max-complexity 10 --ignore=W504
      - run:
          name: checking CLI help
          command: pipenv run bashtest README.rst

workflows:
  version: 2

  documentation:
    jobs:
      - docs

  check_build_deploy:
    jobs:
      - syntax
      - tests:
          requires: [syntax]
          matrix:
            parameters:
              version:
                - "2.7"
                - "3.5"
                - "3.6"
                - "3.7"
                - "3.8"
                - "3.9"
                - "3.10"
                - "3.11"
                - "3.12"
                - "3.13"
                - "3.14"
      - coverage:
          requires: [tests]
      - package:
          requires: [tests]
      - deploy_pypi:
          name: test_deploy
          requires: [package]
      - hold:
          type: approval
          requires: [test_deploy]
          filters: { branches: { only: master } }
      - deploy_pypi:
          name: production_deploy
          repository: pypi
          token_env: PYPI_TOKEN
          requires: [hold]
          filters: { branches: { only: master } }
