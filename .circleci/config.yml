version: 2.1

executors:
  python_base:
    parameters:
      version:
        type: string
        default: "3.9.25"
    docker:
      - image: cimg/python:<< parameters.version >>

commands:
  install_deps:
    parameters:
      version:
        type: string

    steps:
      - restore_cache:
          keys:
            - sshtunnel-py<< parameters.version >>-{{ checksum "sshtunnel.py" }}-{{ checksum "tests/requirements.txt" }}-0
      - run:
          name: Install sshtunnel and build&test dependencies
          environment:
            PIPENV_VENV_IN_PROJECT: 1
          command: |
            python --version
            pipenv --version
            pip --version
            pipenv install -e .
            pipenv install --dev -r tests/requirements.txt
      - save_cache:
          key: sshtunnel-py<< parameters.version >>-{{ checksum "sshtunnel.py" }}-{{ checksum "tests/requirements.txt" }}-0
          paths:
            - .venv/

jobs:
  tests:
    parameters:
      version:
        type: string

    executor:
      name: python_base
      version: << parameters.version >>

    steps:
      - checkout
      - install_deps:
          version: << parameters.version >>
      - run:
          name: Run test suite
          command: >-
            pipenv run py.test tests
            --showlocals
            --durations=10
            -n4
            -W ignore::DeprecationWarning
            --cov sshtunnel
            --cov-report=html:test_results/coverage.html
            --cov-report=term
            --junit-xml=test_results/report.xml
      - run:
          name: Coveralls
          command: pipenv run coveralls
      - store_test_results:
          path: test_results
      - store_artifacts:
          path: test_results

  docs:
    executor:
      name: python_base
      version: "3.9.25"

    steps:
      - checkout
      - install_deps:
          version: "3.9.25"
      - run:
          name: Installing documentation dependencies
          command: pipenv install --dev -r docs/requirements.txt
      - run:
          name: Build documentation
          command: pipenv run sphinx-build -WavE -b html docs _build/html
      - store_artifacts:
          path: _build/html
          destination: sshtunnel-docs

  syntax:
    executor:
      name: python_base
      version: "3.9.25"

    steps:
      - checkout
      - install_deps:
          version: "3.9.25"
      - run:
          name: Installing syntax checks dependencies
          command: pipenv install --dev -r tests/requirements-syntax.txt
      - run:
          name: checking MANIFEST.in
          command: pipenv run check-manifest --ignore tox.ini,tests*,*.yml
      - run:
          name: checking RST syntax
          command: |
            pipenv run python setup.py sdist
            pipenv run twine check dist/*
      - run:
          name: checking PEP8 compliancy
          command: pipenv run flake8 --exclude .venv,build,docs,e2e_tests --max-complexity 10 --ignore=W504
      - run:
          name: checking CLI help
          command: pipenv run bashtest README.rst

  testdeploy:
    executor:
      name: python_base
      version: "3.9.25"

    steps:
      - checkout
      - install_deps:
          version: "3.9.25"
      - run:
          name: Build artifact
          command: pipenv run python setup.py bdist_egg bdist_wheel sdist
      - run:
          name: Check artifacts
          command: pipenv run twine check dist/*
      - store_artifacts:
          path: dist/
      - run:
          name: Upload to TestPyPI
          command: >-
            pipenv run twine upload
            --repository testpypi
            --username __token__
            --password $TESTPYPI_TOKEN
            --skip-existing
            dist/*

  deploy:
    executor:
      name: python_base
      version: "3.9.25"

    steps:
      - checkout
      - install_deps:
          version: "3.9.25"
      - run:
          name: Build artifact
          command: pipenv run python setup.py bdist_egg bdist_wheel sdist
      - run:
          name: Upload to PyPI
          command: >-
            pipenv run twine upload
            --username __token__
            --password $PYPI_TOKEN
            --skip-existing
            dist/*

workflows:
  syntax_and_docs:
    jobs:
      - syntax
      - docs

  test_and_deploy:
    jobs:
      - tests:
          matrix:
            parameters:
               version:
                 - "3.5"
                 - "3.6"
                 - "3.7"
                 - "3.8"
                 - "3.9"
                 - "3.10"
                 - "3.11"
                 - "3.12"
                 - "3.13"
                 - "3.14" 

      - testdeploy:
          requires:
            - tests
      - hold:
          type: approval
          requires:
            - testdeploy
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - hold
          filters:
            branches:
              only: master
